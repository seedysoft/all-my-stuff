info:
  name: search
  type: http
  seq: 1

http:
  method: GET
  url: "{{BaseUrl}}search?q=burgos&format=json&featureType=settlement"
  params:
    - name: q
      value: burgos
      type: query
    - name: format
      value: json
      type: query
      description: xml, json, jsonv2 (default), geojson, geocodejson
    - name: limit
      value: "10"
      type: query
      description: Limit the maximum number of returned results. Cannot be more than 40. Nominatim may decide to return less results than given, if additional results do not sufficiently match the query.
      disabled: true
    - name: addressdetails
      value: "0"
      type: query
      description: When set to 1, include a breakdown of the address into elements. The exact content of the address breakdown depends on the output format.
      disabled: true
    - name: extratags
      value: "0"
      type: query
      description: When set to 1, the response include any additional information in the result that is available in the database, e.g. wikipedia link, opening hours.
      disabled: true
    - name: namedetails
      value: "0"
      type: query
      description: When set to 1, include a full list of names for the result. These may include language variants, older names, references and brand.
      disabled: true
    - name: entrances
      value: "0"
      type: query
      description: When set to 1, include the tagged entrances in the result.
      disabled: true
    - name: featureType
      value: settlement
      type: query
      description: |-
        The featureType allows to have a more fine-grained selection for places from the address layer. Results can be restricted to places that make up the 'state', 'country' or 'city' part of an address. A featureType of settlement selects any human inhabited feature from 'state' down to 'neighbourhood'.
        When featureType is set, then results are automatically restricted to the address layer (see above).
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
